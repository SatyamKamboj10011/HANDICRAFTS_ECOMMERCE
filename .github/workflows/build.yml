# Builds Handcraft Heaven on a Windows machine (free on GitHub).
# - Every push and pull request: builds and keeps the zip as a downloadable artifact.
# - Pushing a version tag (e.g. v2.0.0): also publishes a GitHub Release with the zip,
#   so anyone can download and run the app.

name: Build

on:
  push:
    branches: [main, polish]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release)
        run: msbuild Form_Loading\Form_Loading.sln /p:Configuration=Release /m /v:minimal

      - name: Package
        shell: pwsh
        run: |
          $out = "Form_Loading\bin\Release"
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "$out\HandcraftHeaven.exe", "$out\HandcraftHeaven.exe.config" package\
          Copy-Item README.md package\
          Compress-Archive -Path package\* -DestinationPath HandcraftHeaven-win.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandcraftHeaven-win
          path: HandcraftHeaven-win.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: HandcraftHeaven-win.zip
          generate_release_notes: true
          body: |
            ## Download and run
            1. Download **HandcraftHeaven-win.zip** below and unzip it
            2. Double-click **HandcraftHeaven.exe**
            3. Sign in with **demo / demo123**, create an account, or continue as a guest

            Requires Windows 10 or 11 (.NET Framework 4.7.2, already included in Windows).
            Windows may show a SmartScreen warning because the app isn't code-signed: click **More info → Run anyway**.
